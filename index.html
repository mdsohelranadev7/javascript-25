<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class 25</title>

    <link rel="stylesheet" href="src/output.css">
</head>

<body>
    <!-- loging part  -->
    <div id="logingpart" class=" w-75 mx-auto flex justify-center items-center mt-50 pb-5 h-80 border">
        <div class="">
            <h2 class="uppercase text-2xl text-blue-500 text-center my-5">loging</h2>

            <div class="flex flex-col w-full">

                <div class=" flex flex-col">
                    <label for="">Number</label>
                    <input type="number" placeholder="Enter your number" class="border" id="inputnumber">
                </div>
                <div class=" flex flex-col mt-5">
                    <label for="">Password</label>
                    <input type="password" placeholder="Enter your Password" class="border" id="inputpassword">
                </div>
            </div>
            <button id="loginbtn"
                class="bg-blue-800 text-white rounded-2xl w-full mt-5 py-2 mb-10 uppercase cursor-pointer">Login</button>
        </div>
    </div>
    <!-- loging part  -->

    <!-- cart part  -->
    <div id="cardpart" class=" w-75 mx-auto flex justify-center items-center mt-50 pb-5 h-80 flex-col border" hidden>
        <h2 class="text-2xl text-blue-400">Card</h2>
        <P>Sohel rana</P>
        Account NO : XXXXXXXXXXXXX
        <P id="current">2000</P>
        <div class="flex w-full">
            <button id="addmoneybtn" class=" w-[50%] bg-green-500 text-white">Add money</button>
            <button id="cashoutbtn" class="w-[50%] bg-red-500 text-white">Cashout</button>
        </div>
        <!-- addmoney part -->
        <div id="addmoneyinput" class="w-75" hidden>
            <h3>Add money</h3>
            <input id="addbalance" class="border w-full" type="number" placeholder="Enter your add amount">

            <button id="addmoney" class="px-6 py-1 bg-green-500 mt-2 rounded-2xl">addmoney</button>
        </div>
        <!-- addmoney part -->


        <!-- cashout part  -->
        <div id="cashoutinput" class="w-75" hidden>
            <h3>Cashout</h3>
            <input id="cashoutbalance" class="border w-full" type="number" placeholder="Enter your cashout amount">
            <button id="cashout" class="px-6 py-1 bg-green-500 mt-2 rounded-2xl">cashout</button>
        </div>
        <!-- cashout part  -->
    </div>
    </div>
    <!-- cart part  -->










    <script src="js/script.js"></script>
</body>

</html>
