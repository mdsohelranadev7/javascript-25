<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class 25</title>

    <link rel="stylesheet" href="src/output.css">
</head>

<body>
    <!-- loging part  -->
    <div id="logingpart" class=" w-75 mx-auto flex justify-center items-center mt-50 pb-5 h-80 border">
        <div class="">
            <h2 class="uppercase text-2xl text-blue-500 text-center my-5">loging</h2>

            <div class="flex flex-col w-full">

                <div class=" flex flex-col">
                    <label for="">Number</label>
                    <input type="number" placeholder="Enter your number" class="border" id="inputnumber">
                </div>
                <div class=" flex flex-col mt-5">
                    <label for="">Password</label>
                    <input type="password" placeholder="Enter your Password" class="border" id="inputpassword">
                </div>
            </div>
            <button id="loginbtn"
                class="bg-blue-800 text-white rounded-2xl w-full mt-5 py-2 mb-10 uppercase cursor-pointer">Login</button>
        </div>
    </div>
    <!-- loging part  -->

    <!-- cart part  -->
    <div id="cardpart" class=" w-75 mx-auto flex justify-center items-center mt-50 pb-5 h-80 flex-col border" hidden>
        <div class=" border flex  gap-y-2 flex-col items-center p-2 bg-blue-200">
            <div class="flex justify-between gap-x-10">
                <h2 class="text-[20px] text-blue-400">Bank card</h2>
                <h2 class=" text-blue-400">Active</h2>
            </div>
            <P id="current">2000</P>
            <div class="flex justify-between gap-x-8">
                <span class="text-[8px]">Account NO : XXXXXXXXXXXXX</span>
                <span class="text-[8px]">Sohel rana</span>
            </div>
        </div>
        <div class="flex gap-x-2 w-48 mt-2">
            <button id="addmoneybtn" class=" w-[50%] bg-green-500 text-white uppercase">Add+</button>
            <button id="cashoutbtn" class="w-[50%] bg-red-500 text-white uppercase">Cashout</button>
        </div>
        <!-- addmoney part -->
        <div id="addmoneyinput" class="w-48" hidden>
            <h3 class="uppercase">Add money</h3>
            <input id="addbalance" class="border w-fulln" type="number" placeholder="Enter add amount">

            <button id="addmoney" class="px-6 py-1 bg-green-500 mt-2 rounded-2xl text-white uppercase">addmoney</button>
        </div>
        <!-- addmoney part -->


        <!-- cashout part  -->
        <div id="cashoutinput" class="w-48" hidden>
            <h3 class="uppercase">Cashout</h3>
            <input id="cashoutbalance" class="border w-fulln" type="number" placeholder="Enter cashout amount">
            <button id="cashout" class="px-6 py-1 bg-red-500 mt-2 rounded-2xl text-white uppercase">cashout</button>
        </div>
        <!-- cashout part  -->
    </div>
    </div>
    <!-- cart part  -->










    <script src="js/script.js"></script>
</body>

</html>
